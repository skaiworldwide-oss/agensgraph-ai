[project]
name = "mcp-agensgraph-cypher"
version = "0.2.0"
description = "AgensGraph Cypher MCP server (schema introspection + read/write Cypher tools)."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Muhammad Taha Naveed", email = "skaisw@skaiworldwide.com" },
]
keywords = [
    "agensgraph",
    "cypher",
    "graph",
    "mcp",
    "model context protocol",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp-agensgraph-common[db]>=0.2.0",
    "fastmcp>=3.0.0,<4.0.0",
    "pydantic>=2.10.1",
    "psycopg[binary,pool]>=3.2.9,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/skaiworldwide-oss/agensgraph-ai/tree/main/mcp-agensgraph/servers/mcp-agensgraph-cypher"
Repository = "https://github.com/skaiworldwide-oss/agensgraph-ai"
Issues = "https://github.com/skaiworldwide-oss/agensgraph-ai/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_agensgraph_cypher"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/NOTICE"]

[tool.uv.sources]
mcp-agensgraph-common = { path = "../mcp-agensgraph-common", editable = true }

[tool.uv]
dev-dependencies = [
    "pyright>=1.1.389",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.11.5",
    "aiohttp>=3.8.0",
]

[project.scripts]
mcp-agensgraph-cypher = "mcp_agensgraph_cypher:main"
