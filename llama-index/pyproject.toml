[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-agensgraph"
version = "0.2.0"
description = "LlamaIndex graph + vector store integration for AgensGraph."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.15"
authors = [
    { name = "Muhammad Taha Naveed", email = "taha.n@skaiworldwide.co.kr" },
]
keywords = [
    "agensgraph",
    "graph store",
    "llama-index",
    "property graph",
    "rag",
    "vector store",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "llama-index-core>=0.12,<0.15",
    "psycopg[binary]>=3.2.9,<4.0.0",
    "psycopg-pool>=3.2.1,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/skaiworldwide-oss/agensgraph-ai/tree/main/llama-index"
Repository = "https://github.com/skaiworldwide-oss/agensgraph-ai"
Issues = "https://github.com/skaiworldwide-oss/agensgraph-ai/issues"

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "fastembed>=0.3,<0.9",
]
lint = ["ruff>=0.9"]
typing = ["mypy>=1.15", "types-PyYAML>=6"]
dev = ["ipykernel>=6.29", "jupyter>=1"]

[tool.hatch.build.targets.wheel]
packages = ["llama_index_agensgraph"]

[tool.hatch.build.targets.sdist]
include = ["/llama_index_agensgraph", "/tests", "/README.md", "/LICENSE"]

[tool.llamahub]
contains_example = true
import_path = [
    "llama_index_agensgraph.vector_stores.agensgraph",
    "llama_index_agensgraph.graph_stores.agensgraph",
]

[tool.llamahub.class_authors]
AgensPropertyGraphStore = "llama-index"
AgensgraphVectorStore = "llama-index"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.codespell]
check-filenames = true
check-hidden = true
skip = "*.csv,*.html,*.json,*.jsonl,*.pdf,*.txt,*.ipynb,*.lock"
