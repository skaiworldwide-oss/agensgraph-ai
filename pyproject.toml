[project]
name = "agensgraph-ai"
version = "0.2.0"
description = "Umbrella installer for the AgensGraph AI integrations (LangChain, LlamaIndex, LightRAG, cognee, MCP)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Muhammad Taha Naveed", email = "skaisw@skaiworldwide.com" },
]
keywords = [
    "agensgraph",
    "cognee",
    "graph",
    "langchain",
    "lightrag",
    "llama-index",
    "mcp",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
langchain = ["langchain-agensgraph>=0.2"]
llama-index = ["llama-index-agensgraph>=0.2"]
lightrag = ["lightrag-agensgraph>=0.2"]
cognee = ["cognee-agensgraph>=0.2"]
mcp = [
    "mcp-agensgraph-cypher>=0.2",
    "mcp-agensgraph-memory>=0.2",
    "mcp-agensgraph-data-modeling>=0.2",
]
all = [
    "agensgraph-ai[langchain]",
    "agensgraph-ai[llama-index]",
    "agensgraph-ai[lightrag]",
    "agensgraph-ai[cognee]",
    "agensgraph-ai[mcp]",
]

[project.urls]
Homepage = "https://github.com/skaiworldwide-oss/agensgraph-ai"
Repository = "https://github.com/skaiworldwide-oss/agensgraph-ai"
Issues = "https://github.com/skaiworldwide-oss/agensgraph-ai/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
only-include = ["README.md", "LICENSE", "pyproject.toml"]
