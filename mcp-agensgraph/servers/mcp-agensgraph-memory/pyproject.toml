[project]
name = "mcp-agensgraph-memory"
version = "0.2.0"
description = "AgensGraph knowledge-graph memory MCP server (entities, relations, observations)."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Muhammad Taha Naveed", email = "skaisw@skaiworldwide.com" },
]
keywords = [
    "agensgraph",
    "graph",
    "knowledge graph",
    "mcp",
    "memory",
    "model context protocol",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp-agensgraph-common[db]>=0.2.0",
    "fastmcp>=2.10.5,<3.0.0",
    "psycopg[binary,pool]>=3.2.9,<4.0.0",
    "pydantic>=2.10.1",
]

[project.urls]
Homepage = "https://github.com/skaiworldwide-oss/agensgraph-ai/tree/main/mcp-agensgraph/servers/mcp-agensgraph-memory"
Repository = "https://github.com/skaiworldwide-oss/agensgraph-ai"
Issues = "https://github.com/skaiworldwide-oss/agensgraph-ai/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_agensgraph_memory"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/NOTICE"]

[tool.uv.sources]
mcp-agensgraph-common = { path = "../mcp-agensgraph-common", editable = true }

[tool.uv]
dev-dependencies = [
    "pyright>=1.1.389",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "aiohttp>=3.8.0",
    "ruff>=0.11.5"
]

[project.scripts]
mcp-agensgraph-memory = "mcp_agensgraph_memory:main"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "database: marks tests that require an AgensGraph database connection"
]
