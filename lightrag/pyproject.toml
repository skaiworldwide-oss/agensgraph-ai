[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightrag-agensgraph"
version = "0.2.0"
description = "Complete LightRAG storage backend for AgensGraph (graph + vector + KV + doc-status)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Muhammad Taha Naveed", email = "skaisw@skaiworldwide.com" },
]
keywords = [
    "lightrag",
    "agensgraph",
    "graph store",
    "vector store",
    "rag",
    "knowledge graph",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lightrag-hku>=1.5.3,<1.6",
    "psycopg[binary,pool]>=3.1.0",
    "pgvector>=0.2.5",
    "tenacity>=8.0",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/skaiworldwide-oss/agensgraph-ai/tree/main/lightrag"
Repository = "https://github.com/skaiworldwide-oss/agensgraph-ai"
Issues = "https://github.com/skaiworldwide-oss/agensgraph-ai/issues"

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "python-dotenv>=1.0",
]
lint = ["ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["lightrag_agensgraph"]

[tool.hatch.build.targets.sdist]
include = ["/lightrag_agensgraph", "/tests", "/README.md", "/LICENSE"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
