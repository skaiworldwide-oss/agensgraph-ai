[project]
name = "mcp-agensgraph-cypher"
version = "0.2.0"
description = "AgensGraph Cypher MCP server (schema introspection + read/write Cypher tools)."
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "mcp-agensgraph-common[db]>=0.1.0",
    "fastmcp>=2.10.5,<3.0.0",
    "pydantic>=2.10.1",
    "psycopg[binary,pool]>=3.2.9,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
mcp-agensgraph-common = { path = "../mcp-agensgraph-common", editable = true }

[tool.uv]
dev-dependencies = [
    "pyright>=1.1.389",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.11.5",
    "aiohttp>=3.8.0",
]

[project.scripts]
mcp-agensgraph-cypher = "mcp_agensgraph_cypher:main"
