[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-agensgraph"
version = "0.1.0"
description = "LangChain integration for the AgensGraph graph + vector store."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.15"
authors = [
    { name = "Muhammad Taha Naveed", email = "taha.n@skaiworldwide.co.kr" },
]
keywords = [
    "agensgraph",
    "graph",
    "graph-store",
    "langchain",
    "rag",
    "vector",
    "vector-store",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "numpy>=1.21,<3",
    "psycopg[binary]>=3.2.9,<4.0.0",
    "psycopg-pool>=3.2.1,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/skaiworldwide-oss/agensgraph-ai/tree/main/langchain"
Repository = "https://github.com/skaiworldwide-oss/agensgraph-ai"
Issues = "https://github.com/skaiworldwide-oss/agensgraph-ai/issues"

[dependency-groups]
test = [
    "langchain-tests>=1.1.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=5",
    "pytest-socket>=0.7",
    "syrupy>=4",
]
lint = ["ruff>=0.9"]
typing = ["mypy>=1.15", "types-PyYAML>=6"]
dev = ["ipykernel>=6.29", "ipython>=8.10", "jupyter>=1"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_agensgraph"]

[tool.hatch.build.targets.sdist]
include = [
    "/langchain_agensgraph",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T201"]

[tool.mypy]
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic",
]
