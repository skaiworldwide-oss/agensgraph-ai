[project]
name = "mcp-agensgraph-data-modeling"
version = "0.2.0"
description = "AgensGraph data-modeling MCP server (validate models, generate ingest/constraint Cypher, Arrows/Mermaid)."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Muhammad Taha Naveed", email = "skaisw@skaiworldwide.com" },
]
keywords = [
    "agensgraph",
    "data modeling",
    "graph",
    "mcp",
    "model context protocol",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp-agensgraph-common>=0.2.0",
    "fastmcp>=3.0.0,<4.0.0",
    "pydantic>=2.10.1",
]

[project.urls]
Homepage = "https://github.com/skaiworldwide-oss/agensgraph-ai/tree/main/mcp-agensgraph/servers/mcp-agensgraph-data-modeling"
Repository = "https://github.com/skaiworldwide-oss/agensgraph-ai"
Issues = "https://github.com/skaiworldwide-oss/agensgraph-ai/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_agensgraph_data_modeling"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/NOTICE"]

[tool.uv.sources]
mcp-agensgraph-common = { path = "../mcp-agensgraph-common", editable = true }

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.29.5",
    "pyright>=1.1.389",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.3",
    "ruff>=0.11.5",
    "aiohttp>=3.8.0",
    "psycopg[binary,pool]>=3.2.9,<4.0.0",
    "psycopg-pool>=3.2.6,<4.0.0"
]

[project.scripts]
mcp-agensgraph-data-modeling = "mcp_agensgraph_data_modeling:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "database: marks tests that require an AgensGraph database connection"
]
