# The six-leg server matrix for the integration and compat suites, on ports 55414–55419.
#
#   make test-images          # builds agensgraph-test:<release>-pgvector0.8.7 for every leg
#   docker compose -f tests/compose.yml up -d --wait
#   make test-compat
#   docker compose -f tests/compose.yml down -v
#
# Password authentication, as CI has it: a test that connects as another role must give a password.
name: agensgraph-test

x-leg: &leg
  environment:
    POSTGRES_PASSWORD: agens
  tmpfs:
    - /var/lib/postgresql/data
  shm_size: 256m

services:
  ag2141:
    <<: *leg
    image: agensgraph-test:2.14.1-pgvector0.8.7
    ports: ["127.0.0.1:55414:5432"]
  ag2150:
    <<: *leg
    image: agensgraph-test:2.15.0-pgvector0.8.7
    ports: ["127.0.0.1:55415:5432"]
  ag2160:
    <<: *leg
    image: agensgraph-test:2.16.0-pgvector0.8.7
    ports: ["127.0.0.1:55416:5432"]
  ag2170:
    <<: *leg
    image: agensgraph-test:2.17.0-pgvector0.8.7
    ports: ["127.0.0.1:55417:5432"]
  # PostgreSQL 18 keeps its data under /var/lib/postgresql/18 and refuses a mount at .../data.
  ag21840:
    <<: *leg
    image: agensgraph-test:2.18.4.0-pgvector0.8.7
    ports: ["127.0.0.1:55419:5432"]
    tmpfs:
      - /var/lib/postgresql
  ag21861:
    <<: *leg
    image: agensgraph-test:2.18.6.1-pgvector0.8.7
    ports: ["127.0.0.1:55418:5432"]
    tmpfs:
      - /var/lib/postgresql
